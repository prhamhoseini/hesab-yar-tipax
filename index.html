<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0868c8"><meta name="mobile-web-app-capable" content="yes"><meta name="application-name" content="حساب یار تیپاکس"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><title>حساب یار تیپاکس</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17324d;font-family:Tahoma,Arial,sans-serif}.app{max-width:720px;margin:auto;padding-bottom:30px}header{background:linear-gradient(135deg,#075db1,#1185e8);color:#fff;padding:22px 17px 27px;border-radius:0 0 28px 28px;box-shadow:0 8px 25px #075db133}.brand{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;border-radius:17px;background:#ffd21a;display:grid;place-items:center;font-size:31px}h1{font-size:21px;margin:0 0 4px}.sub{font-size:12px;opacity:.9}.date{margin-top:17px;background:#ffffff1c;border:1px solid #ffffff35;border-radius:14px;padding:10px;font-size:13px}main{padding:15px}.card{background:#fff;border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 5px 18px #153b5d12}label{display:block;font-size:12px;font-weight:bold;color:#527087;margin-bottom:7px}input,select{width:100%;padding:13px;border:1px solid #dbe5ee;border-radius:13px;background:#fbfdff;font-size:14px;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}button{border:0;border-radius:13px;padding:12px;font-weight:bold;font-size:13px}.primary{background:#0868c8;color:#fff;width:100%;margin-top:13px}.install{display:none;background:#fff8d7;border:1px solid #ead15c;color:#604d00;border-radius:15px;padding:12px;margin-bottom:13px;line-height:1.8;font-size:12px}.install button{background:#0868c8;color:#fff;width:100%;margin-top:7px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f6faff;border:1px solid #e4eef7;border-radius:16px;padding:14px}.num{font-size:20px;font-weight:bold;color:#0868c8;margin-top:5px}.item{border:1px solid #e4ebf1;border-radius:16px;padding:13px;margin-top:10px}.top{display:flex;justify-content:space-between;gap:8px}.amount{font-weight:bold;color:#0871c9}.meta{font-size:11px;color:#7890a0;margin-top:7px}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1}.edit{background:#edf4fa;color:#236087}.del{background:#fff0f0;color:#b33}.empty{text-align:center;color:#8ba0af;padding:22px}.cancel{display:none;width:100%;margin-top:8px;background:#fff0f0;color:#b33}@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">📦</div><div><h1>حساب یار تیپاکس</h1><div class="sub">ثبت و مدیریت هزینه بسته‌ها</div></div></div><div class="date" id="today"></div></header><main>
<div class="install" id="installBox">برای نصب مثل یک برنامه، دکمه زیر را بزن. اگر دکمه نمایش داده نشد، از منوی سه‌نقطه Chrome گزینه «افزودن به صفحه اصلی / Add to Home screen» را انتخاب کن.<button id="installBtn">📲 نصب حساب یار روی صفحه اصلی</button></div>
<section class="card"><div class="grid"><div class="full"><label>نام صاحب بسته</label><input id="owner" placeholder="مثلاً علی احمدی"></div><div><label>مبلغ (تومان)</label><input id="amount" type="number" inputmode="numeric" placeholder="250000"></div><div><label>روش پرداخت</label><select id="payment"><option>کارتخوان</option><option>انتقال بانکی</option><option>نقدی</option><option>سایر</option></select></div></div><button class="primary" id="save">ثبت بسته</button><button class="cancel" id="cancel">انصراف از ویرایش</button></section>
<section class="card"><div class="stats"><div class="stat">تعداد بسته‌ها<div class="num" id="count">۰</div></div><div class="stat">مجموع دریافتی<div class="num" id="total">۰ تومان</div></div></div></section>
<section class="card"><label>جستجوی صاحب بسته</label><input id="search" placeholder="نام را وارد کنید..."><div id="list"></div></section>
</main></div>
<script>
const KEY='hesabyar-tipax-v3';let data=JSON.parse(localStorage.getItem(KEY)||'[]'),editing=null,deferredPrompt=null;
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);const money=n=>Number(n||0).toLocaleString('fa-IR')+' تومان';
function jalali(gy,gm,gd){let g=[0,31,59,90,120,151,181,212,243,273,304,334],gy2=gm>2?gy+1:gy,d=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+g[gm-1];let jy=-1595+33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365}let jm=d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),jd=1+(d<186?d%31:(d-186)%30);return fa(jy)+'/'+fa(String(jm).padStart(2,'0'))+'/'+fa(String(jd).padStart(2,'0'))}
function today(){let d=new Date(),w=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'][d.getDay()];todayEl.textContent=w+' • '+jalali(d.getFullYear(),d.getMonth()+1,d.getDate())}const todayEl=document.getElementById('today');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){let q=search.value.trim().toLowerCase(),a=data.filter(x=>x.owner.toLowerCase().includes(q));count.textContent=fa(data.length);total.textContent=money(data.reduce((s,x)=>s+Number(x.amount),0));list.innerHTML=a.length?a.map(x=>`<div class="item"><div class="top"><b>${esc(x.owner)}</b><span class="amount">${money(x.amount)}</span></div><div class="meta">${esc(x.date)} • ${esc(x.payment)}</div><div class="actions"><button class="edit" onclick="editItem('${x.id}')">ویرایش</button><button class="del" onclick="delItem('${x.id}')">حذف</button></div></div>`).join(''):'<div class="empty">هنوز بسته‌ای ثبت نشده است.</div>'}function saveData(){localStorage.setItem(KEY,JSON.stringify(data))}
save.onclick=()=>{let o=owner.value.trim(),a=Number(amount.value),p=payment.value;if(!o||!a){alert('نام و مبلغ را وارد کن.');return}if(editing){let x=data.find(z=>z.id===editing);Object.assign(x,{owner:o,amount:a,payment:p});editing=null;save.textContent='ثبت بسته';cancel.style.display='none'}else data.unshift({id:Date.now(),owner:o,amount:a,payment:p,date:todayEl.textContent});saveData();owner.value='';amount.value='';render()};
window.editItem=id=>{let x=data.find(z=>z.id==id);editing=id;owner.value=x.owner;amount.value=x.amount;payment.value=x.payment;save.textContent='ذخیره تغییرات';cancel.style.display='block';scrollTo({top:0,behavior:'smooth'})};window.delItem=id=>{if(confirm('این بسته حذف شود؟')){data=data.filter(x=>x.id!=id);saveData();render()}};cancel.onclick=()=>{editing=null;owner.value='';amount.value='';save.textContent='ثبت بسته';cancel.style.display='none'};search.oninput=render;today();render();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBox.style.display='block'});installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBox.style.display='none'}else alert('از منوی سه‌نقطه Chrome گزینه «افزودن به صفحه اصلی» را بزن.')};window.addEventListener('appinstalled',()=>installBox.style.display='none');
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
